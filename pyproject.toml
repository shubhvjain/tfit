[project]
name = "tfitpy"
version = "0.6.2"
description = "TFit : Assessing the combinatorial potential of Transcription Factors in Gene Regulation"
authors = [
    {name = "SVJ"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11, !=3.14.1"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "platformdirs (>=4.5.1,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "decoupler (>=2.1.3,<3.0.0)",
    "scipy (<1.16)",
    "omnipath (>=1.0.12,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "pooch (>=1.9.0,<2.0.0)",
    "goatools (>=1.5.2,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pyjaspar (>=4.0.0,<5.0.0)",
    "pyfaidx (>=0.9.0.4,<0.10.0.0)"

]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
sphinx = "8.2.3"
myst-nb = "^1.3.0"
jupyter = "^1.1.1"
sphinx-book-theme = "^1.1.4"
sphinx-autodoc-typehints = "^3.5.1"
pytest = "^9.0.2"
sphinxcontrib-bibtex = "^2.6.5"


[tool.poetry.scripts]
tfitpy = "tfitpy.cli:cli"
